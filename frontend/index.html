<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Vault - Academic Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app-container">
        
        <aside id="sidebar">
            
            <div class="brand-header">
                <h2>CAMPUS VAULT</h2>
                <span class="portal-badge">STUDENT PORTAL</span>
            </div>

            <div class="context-selector">
                <label for="branch-select">Branch Context</label>
                <select id="branch-select">
                    <option value="cse" selected>CSE Portal</option>
                    <option value="ece">ECE Portal</option>
                    <option value="me">ME Portal</option>
                </select>
            </div>

            <div class="context-selector">
                <label for="subject-select">Select Subject</label>
                <select id="subject-select">
                    <option value="java" selected>Java Programming</option>
                    <option value="dbms">Database Management Systems</option>
                    <option value="cn">Computer Networks</option>
                    <option value="os">Operating Systems</option>
                    <option value="dsa">Data Structures & Algorithms</option>
                    <option value="co">Computer Organization</option>
                </select>
            </div>

            <button class="upload-btn">+ UPLOAD MATERIAL</button>

            <div class="user-profile-zone">
                
                <div class="admin-hidden-popover">
                    <div class="popover-title">Review Metrics</div>
                    <div class="tracker-item">
                        <span>Approved Uploads</span>
                        <span class="count-badge badge-approved">3</span>
                    </div>
                    <div class="tracker-item">
                        <span>Pending Review</span>
                        <span class="count-badge badge-pending">1</span>
                    </div>
                </div>

                <div class="profile-card-trigger">
                    <div class="avatar">SK</div>
                    <div class="user-info">
                        <span class="user-name">Sridhar</span>
                        <span class="user-role">Student Contributor ▼</span>
                    </div>
                </div>

                <div class="action-row">
                    <button class="footer-btn logout">LOGOUT</button>
                    <button class="footer-btn exit">EXIT</button>
                </div>
            </div>

        </aside>

        <main id="content-grid">
            
            <header class="content-header">
                <div class="header-top-row">
                    <div class="breadcrumb-trail">Subjects &gt; <span class="active-sub">Java Programming</span></div>
                </div>
                
                <div class="category-tabs-bar">
                    <button class="tab-btn active-tab">📁 Notes</button>
                    <button class="tab-btn">🔬 Lab Manuals</button>
                    <button class="tab-btn">📜 PYPs</button>
                    <button class="tab-btn">🌐 Links</button>
                </div>
            </header>
            
            <section class="grid-display">
                
                <div class="resource-card">
                    <div class="card-upper">
                        <div class="file-tag">PDF</div>
                        <h3 class="file-title">Unit 1: Object Oriented System Concepts</h3>
                    </div>
                    <div class="card-lower">
                        <span>Uploader: Sridhar</span>
                        <span>May 24, 2026</span>
                    </div>
                </div>

                <div class="resource-card">
                    <div class="card-upper">
                        <div class="file-tag">PDF</div>
                        <h3 class="file-title">Mid-Term Mock Previous Year Paper</h3>
                    </div>
                    <div class="card-lower">
                        <span>Uploader: Admin</span>
                        <span>May 20, 2026</span>
                    </div>
                </div>

            </section>
        </main>

    </div>

</body>
</html>
